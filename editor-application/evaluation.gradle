/* L'engin d'exécution regroupe les classes sous les paquets :
 * façade, handler, journal, model, preprocess, process, repository, service et util.
 * */
jacocoTestReport {
  dependsOn test
  afterEvaluate {
      classDirectories.setFrom(files(classDirectories.files.collect {
          fileTree(dir: it, exclude: [
            '**/ca/mbjolin/editor/integration/**', // Il n'y a que les tests servant à l'évaluation.
            '**/ca/mbjolin/editor/test/**', // Il n'y a que les tests servant à l'évaluation.
            '**/ca/mbjolin/editor/unit/**', // Il n'y a que les tests servant à l'évaluation.
            '**/ca/mbjolin/antlr/**', // Ces classes sont générées par ANTLR.
            '**/ca/mbjolin/editor/config/**', // Ces classes servent pour l'interface utilisateur.
            '**/ca/mbjolin/editor/web/**', // Ces classes servent pour l'interface utilisateur.
            '**/ca/mbjolin/editor/dao/**', // Ces classes servent surtout au CRUD pour la persistance de l'Atelier.
            '**/ca/mbjolin/editor/**/*Atelier*.*', //L'Atelier ne fait pas partie de l'engin d'exécution.
            '**/ca/mbjolin/editor/model/**', //Pour la future version de l'interface utilisateur.
            '**/ca/mbjolin/editor/facade/**', //Pour la future version qui va gérer les métamodeles.
            '**/ca/mbjolin/editor/util/**', //Pour la future version qui va gérer les métamodeles.
            '**/ca/mbjolin/editor/service/**' //Ne touche pas à l'engin.
          ])
      }))
  }
}


task runCasAll(type: Test) {
  filter {
      includeTestsMatching 'ca.mbjolin.editor.evaluation.**'
  }
}

task coverageCasAll(type: JacocoReport) {
dependsOn runCasAll

executionData runCasAll

classDirectories.setFrom(sourceSets.main.output)
sourceDirectories.setFrom(sourceSets.main.allSource)

afterEvaluate {
  classDirectories.setFrom(files(classDirectories.files.collect {
      fileTree(dir: it, exclude: [
          '**/ca/mbjolin/editor/integration/**', // Il n'y a que les tests servant à l'évaluation.
          '**/ca/mbjolin/editor/test/**', // Il n'y a que les tests servant à l'évaluation.
          '**/ca/mbjolin/editor/unit/**', // Il n'y a que les tests servant à l'évaluation.
          '**/ca/mbjolin/antlr/**', // Ces classes sont générées par ANTLR.
          '**/ca/mbjolin/editor/config/**', // Ces classes servent pour l'interface utilisateur.
          '**/ca/mbjolin/editor/web/**', // Ces classes servent pour l'interface utilisateur.
          '**/ca/mbjolin/editor/dao/**', // Ces classes servent surtout au CRUD pour la persistance de l'Atelier.
          '**/ca/mbjolin/editor/**/*Atelier*.*', //L'Atelier ne fait pas partie de l'engin d'exécution.
          '**/ca/mbjolin/editor/model/**', //Pour la future version de l'interface utilisateur.
          '**/ca/mbjolin/editor/facade/**', //Pour la future version qui va gérer les métamodeles.
          '**/ca/mbjolin/editor/util/**', //Pour la future version qui va gérer les métamodeles.
          '**/ca/mbjolin/editor/service/**' //Ne touche pas à l'engin.
      ])
  }))
}

reports {
    html.required = true
    html.outputLocation = layout.buildDirectory.dir("reports/jacoco/casAll")
    xml.required = false
}
}

