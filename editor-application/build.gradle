plugins {
    id 'java'
    id 'io.quarkus'
    id 'jacoco'
}

repositories {
    mavenCentral()
    mavenLocal()
}

//https://dev.to/humzakt/interacting-with-apache-age-best-practices-for-application-developers-hgh
//https://github.com/zombodb/zombodb/blob/master/THINGS-TO-KNOW.md

dependencies {
    implementation enforcedPlatform("${quarkusPlatformGroupId}:${quarkusPlatformArtifactId}:${quarkusPlatformVersion}")

    implementation 'io.quarkus:quarkus-rest'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-undertow' //pour sessionscope

    implementation 'commons-dbutils:commons-dbutils:1.8.1'
    implementation 'io.quarkus:quarkus-rest-qute'
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.0'
    implementation 'io.quarkus:quarkus-elytron-security-jdbc'
    implementation 'io.quarkus:quarkus-arc'
    implementation 'io.quarkiverse.web-bundler:quarkus-web-bundler:1.9.2'

    implementation 'software.xdev:chartjs-java-model:1.4.0'
    implementation "org.jooq:jooq:3.19.14"
    implementation 'ca.mbjolin:editor-jooq-library:0.0.1-SNAPSHOT'

    implementation group: 'org.antlr', name: 'ST4', version: '4.3.4'
    implementation group: 'org.antlr', name: 'antlr4-runtime', version: '4.13.2'
    implementation group: 'org.antlr', name: 'antlr4', version: '4.13.2'

    /* Est-ce que je switch pour SPEL? */
    implementation group: 'org.mvel', name: 'mvel2', version: '2.5.2.Final'
    implementation group: 'org.jeasy', name: 'easy-rules-core', version: '4.1.0'
    implementation group: 'org.jeasy', name: 'easy-rules-mvel', version: '4.1.0'

    implementation group: 'commons-io', name: 'commons-io', version: '2.17.0'
    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.17.0'

    implementation group: 'org.apache.commons', name: 'commons-collections4', version: '4.4'
    /* Les dependencies webjars doivent etre bundler webjars.npm */
    
    implementation 'org.alloytools:org.alloytools.alloy.dist:6.2.0'

    testImplementation("org.testcontainers:testcontainers:1.21.4")
    testImplementation "org.testcontainers:junit-jupiter:1.21.4"
    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.rest-assured:rest-assured'
    testImplementation "net.jqwik:jqwik:1.9.2"
}

group 'ca.mbjolin'
version '0.0.1-SNAPSHOT'


sourceSets {
  main {
    java {
     srcDirs = [
              "src/gen/java",
              "src/main/java",
              "src/main/sql",
              "src/generated/java" // Elle est générée et versionnée comme pour le plugin camel.
            ]
    }
  }
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}
compileJava {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.encoding = 'UTF-8'
}

apply from: 'evaluation.gradle'
